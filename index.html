<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Таймер Фокуса</h1>
        
        <div class="tabs" id="profile-tabs"></div>

        <div class="stats">
            Сессий: <span id="sessions-count">0</span> | 
            Часов работы: <span id="hours-count">0.0</span>
        </div>

        <div class="timer-display">
            <h2 id="mode-text">Работа</h2>
            <div id="time-left">25:00</div>
            <p id="cycle-text">Цикл: 1 / 4</p>
        </div>

        <div class="controls">
            <button id="start-btn">Старт</button>
            <button id="pause-btn">Пауза</button>
            <button id="reset-btn">Сброс</button>
        </div>

        <div class="settings">
            <h3>Настройки профиля</h3>
            
            <label>Название: <input type="text" id="profile-name" maxlength="20"></label>
            <label class="color-label">Цвет профиля: <input type="color" id="profile-color"></label>

            <div class="time-settings-grid">
                <div class="slider-group">
                    <label>Работа: <span id="work-time-val" class="val-display">25</span> мин</label>
                    <input type="range" id="work-time" min="20" max="120" step="5">
                </div>
                
                <div class="slider-group">
                    <label>Кор. перерыв: <span id="short-break-val" class="val-display">5</span> мин</label>
                    <input type="range" id="short-break" min="5" max="20" step="5">
                </div>
                
                <div class="slider-group">
                    <label>Длин. перерыв: <span id="long-break-val" class="val-display">20</span> мин</label>
                    <input type="range" id="long-break" min="15" max="40" step="5">
                </div>
                
                <div class="cycles-group">
                    <label>Количество циклов:</label>
                    <div class="cycles-selector">
                        <input type="radio" name="cycles" id="c1" value="1"><label for="c1">1</label>
                        <input type="radio" name="cycles" id="c2" value="2"><label for="c2">2</label>
                        <input type="radio" name="cycles" id="c3" value="3"><label for="c3">3</label>
                        <input type="radio" name="cycles" id="c4" value="4"><label for="c4">4</label>
                        <input type="radio" name="cycles" id="c5" value="5"><label for="c5">5</label>
                    </div>
                </div>
            </div>
            
            <h3>Музыка (YouTube)</h3>
            <label>Фон для работы: <input type="text" id="work-music" placeholder="Ссылка на YouTube..."></label>
            <div class="presets-container" id="work-presets"></div>

            <label>Фон для отдыха: <input type="text" id="break-music" placeholder="Ссылка на YouTube..."></label>
            <div class="presets-container" id="break-presets"></div>
            
            <div class="add-preset-form">
                <h4>+ Сохранить новую ссылку</h4>
                <input type="text" id="new-preset-name" placeholder="Название (напр. Lofi)">
                <input type="text" id="new-preset-url" placeholder="Ссылка YouTube">
                <select id="new-preset-type">
                    <option value="work">Для работы</option>
                    <option value="break">Для отдыха</option>
                </select>
                <button id="add-preset-btn">Добавить в закладки</button>
            </div>
            
            <button id="save-settings-btn">Сохранить профиль</button>
        </div>
    </div>

    <div id="yt-player-work" style="display: none;"></div>
    <div id="yt-player-break" style="display: none;"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
